<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>TrainLiveMap 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
html,body,#map{margin:0;height:100%;font-family:system-ui,sans-serif}
#panel{position:absolute;top:10px;left:10px;background:#fffd;padding:10px;border-radius:8px;max-width:260px;font-size:13px}
.t{padding:0 4px;height:14px;border-radius:3px;border:1px solid #fff;color:#fff;font:bold 9px/14px sans-serif;text-align:center;cursor:pointer;box-shadow:0 0 3px #000;white-space:nowrap}
.sel{outline:3px solid #ff0}
.st{font:11px/1.1 system-ui,sans-serif;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;pointer-events:none;transform-origin:left}
.st b{font-weight:600}.st span{opacity:.85;font-size:10px}
button{margin:2px}
</style></head><body>
<div id="map"></div>
<div id="panel">
 <b>TrainLiveMap</b> <span id="upd"></span><br>
 <select id="base"><option value="sat">Satellite</option><option value="osm">OpenStreetMap</option></select>
 <label><input type="checkbox" id="ter" checked> 3D terrain</label><br>
 <label><input type="checkbox" id="rail" checked> Track</label>
 <label><input type="checkbox" id="labels" checked> Station labels</label><br>
 <div>Tilt <input id="pitch" type="range" min="0" max="85" value="0" style="width:150px"> <span id="pv">0</span>°</div>
 <div>Rotate <input id="brg" type="range" min="0" max="360" value="0" style="width:130px"> <span id="bv">0</span>°</div>
 <div>Terrain ×<input id="exg" type="range" min="1" max="5" step="0.1" value="1.6" style="width:130px"> <span id="ev">1.6</span></div>
 <select id="pick"><option value="">— select train —</option></select>
 <button id="follow">Follow</button><button id="stop">Stop</button>
 <div id="info" style="margin-top:6px"></div>
 <div style="margin-top:6px;color:#555">Positions are estimated: timetable plus live delay where available, otherwise 60 km/h.</div>
</div>
<script>
const SPEED_KMH = 60, COLORS = {1:'#c0392b',2:'#2980b9',3:'#27ae60',4:'#8e44ad'};
const map = new maplibregl.Map({container:'map',bounds:[[97.3,5.6],[105.7,20.5]],fitBoundsOptions:{padding:20},pitch:0,maxPitch:85,style:{version:8,
 sources:{
  sat:{type:'raster',tiles:['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2021_3857/default/g/{z}/{y}/{x}.jpg'],tileSize:256,maxzoom:13,attribution:'Sentinel-2 cloudless by EOX (Copernicus data 2021)'},
  osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap contributors'},
  dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:15,attribution:'Terrain: AWS Open Data / Mapzen'}},
 layers:[{id:'sat',type:'raster',source:'sat'},{id:'osm',type:'raster',source:'osm',layout:{visibility:'none'}}],
 terrain:{source:'dem',exaggeration:1.6},
 sky:{'sky-color':'#7fb2e5','horizon-color':'#d6e6f2','fog-color':'#d6e6f2','sky-horizon-blend':.7,'horizon-fog-blend':.6,'fog-ground-blend':.75,'atmosphere-blend':0}}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}));
const $=id=>document.getElementById(id);
$('base').onchange=e=>{map.setLayoutProperty('sat','visibility',e.target.value==='sat'?'visible':'none');map.setLayoutProperty('osm','visibility',e.target.value==='osm'?'visible':'none');};
const exag=()=>+$('exg').value;
$('ter').onchange=e=>map.setTerrain(e.target.checked?{source:'dem',exaggeration:exag()}:null);
$('exg').oninput=e=>{$('ev').textContent=exag();if($('ter').checked)map.setTerrain({source:'dem',exaggeration:exag()});};
$('pitch').oninput=e=>map.setPitch(+e.target.value);
$('brg').oninput=e=>map.setBearing(+e.target.value);
map.on('pitch',()=>{const v=Math.round(map.getPitch());$('pitch').value=v;$('pv').textContent=v;});
map.on('rotate',()=>{const v=Math.round((map.getBearing()+360)%360);$('brg').value=v;$('bv').textContent=v;});

let chains={}, timetable={}, trains={}, selected=null, following=false;
const hav=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
// fractional row -> coordinate along the chain of stations
function locate(chain,row){
  const c=chains[chain]; if(!c) return null;
  if(row<=c[0].row) return {lat:c[0].lat,lon:c[0].lon,seg:0,f:0};
  for(let i=0;i<c.length-1;i++) if(row<=c[i+1].row){const f=(row-c[i].row)/(c[i+1].row-c[i].row);
    return {lat:c[i].lat+(c[i+1].lat-c[i].lat)*f,lon:c[i].lon+(c[i+1].lon-c[i].lon)*f,seg:i,f};}
  const l=c[c.length-1]; return {lat:l.lat,lon:l.lon,seg:Math.max(c.length-2,0),f:c.length>1?1:0};
}
// Convert server row to a position; a train between rows is shown mid-cell, then dead-reckoned toward the next station.
function target(t){
  const c=chains[t.chain]; if(!c) return null;
  const base=locate(t.chain,t.row); if(!base) return null;
  return {seg:base.seg, f:base.f, dir:t.dir};
}
function coord(chain,seg,f){const c=chains[chain],a=c[seg],b=c[seg+1]||a;return [a.lon+(b.lon-a.lon)*f,a.lat+(b.lat-a.lat)*f];}

async function refresh(){
  const [cs,ts]=await Promise.all([fetch('/api/chains').then(r=>r.json()),fetch('/api/trains').then(r=>r.json())]);
  chains=cs; $('upd').textContent=ts.updated?new Date(ts.updated).toLocaleTimeString():'';
  const seen=new Set(), now=performance.now();
  for(const s of ts.trains){
    seen.add(s.id); const tg=target(s); if(!tg) continue;
    let t=trains[s.id];
    if(!t){const el=document.createElement('div');el.className='t';el.style.background=COLORS[s.line];el.textContent=s.no;
      el.onclick=()=>select(s.id);t={el,marker:new maplibregl.Marker({element:el,anchor:'bottom',offset:[0,-6]}).setLngLat(coord(s.chain,tg.seg,tg.f)).addTo(map),seg:tg.seg,f:tg.f};trains[s.id]=t;
      const o=document.createElement('option');o.value=s.id;o.textContent=s.no;$('pick').appendChild(o);}
    // keep dead-reckoned position unless server moved the train to a different segment/further along
    const moved = tg.seg!==t.seg || (tg.dir*(tg.f-t.f)>0.15) ;
    if(moved||!t.s||t.s.chain!==s.chain){t.seg=tg.seg;t.f=tg.f;}
    t.s=s;
  }
  for(const id of Object.keys(trains)) if(!seen.has(id)){trains[id].marker.remove();delete trains[id];[...$('pick').options].filter(o=>o.value===id).forEach(o=>o.remove());}
}
// Schedule estimate: scheduled position at (now - delay), never past the next station after the one the live feed reports.
const DAY=86400;
function bkkSec(){const d=new Date();return ((d.getTime()/1000+7*3600)%DAY);}
function schedulePos(s){
  const tt=timetable[s.no]; if(!tt) return null;
  const K=tt.knots; let r=((bkkSec()-s.lateMin*60-tt.t0)%DAY+DAY)%DAY;
  const i=s.st?K.findIndex(k=>k.key===s.st):-1;
  if(i>=0){
    if(s.atStation||s.status!==0) r=K[i].dep;
    else if(r<K[i].dep) r=K[i].dep;
    else if(K[i+1]&&r>K[i+1].arr) r=K[i+1].arr;
  }
  if(r<=K[0].r) return {lon:K[0].lon,lat:K[0].lat,next:K[1]};
  for(let j=0;j<K.length-1;j++){const a=K[j],b=K[j+1];
    if(r<=a.dep) return {lon:a.lon,lat:a.lat,next:b};
    if(r<b.arr){const f=(r-a.dep)/(b.arr-a.dep);return {lon:a.lon+(b.lon-a.lon)*f,lat:a.lat+(b.lat-a.lat)*f,next:b};}
    if(r<=b.dep) return {lon:b.lon,lat:b.lat,next:K[j+2]||b};
  }
  const l=K[K.length-1];return {lon:l.lon,lat:l.lat,next:l};
}
let last=performance.now();
let lastTrainDraw=0;
function frame(now){
  const dt=(now-last)/1000; last=now;
  const drawAll=now-lastTrainDraw>250; if(drawAll)lastTrainDraw=now;
  const bd=map.getBounds();
  for(const id in trains){const t=trains[id],s=t.s; if(!s) continue;
    if(!(drawAll||(following&&id===selected))){t.dt=(t.dt||0)+dt;continue;}
    const tdt=(t.dt||0)+dt; t.dt=0;
    const sp=schedulePos(s); t.sp=sp;
    if(sp){place(t,id,[sp.lon,sp.lat],sp.next,bd);continue;}
    const c=chains[s.chain]; if(!c) continue;
    if(!s.atStation && s.status===0){ // dead reckoning toward next station in travel direction, capped at that station
      const a=c[t.seg],b=c[t.seg+1]; if(b){const len=Math.max(hav(a,b),0.1);t.f+=s.dir*(SPEED_KMH/3600)*tdt/len;
        t.f=Math.min(Math.max(t.f,0),1);}}
    place(t,id,coord(s.chain,t.seg,t.f),s.dir>0?c[t.seg+1]||c[t.seg]:c[t.seg],bd);}
  if(drawAll||following)drawBoxes();
  if(following&&selected&&trains[selected]){
    const t=trains[selected];
    map.jumpTo({center:t.pos||t.marker.getLngLat(),bearing:t.head||0,pitch:72,zoom:Math.max(map.getZoom(),14)});}
  info(); requestAnimationFrame(frame);
}
function bearingTo(ll,p){const t=x=>x*Math.PI/180,y=Math.sin(t(p.lon-ll.lng))*Math.cos(t(p.lat)),x=Math.cos(t(ll.lat))*Math.sin(t(p.lat))-Math.sin(t(ll.lat))*Math.cos(t(p.lat))*Math.cos(t(p.lon-ll.lng));return (Math.atan2(y,x)*180/Math.PI+360)%360;}
function select(id){selected=id;$('pick').value=id;Object.values(trains).forEach(t=>t.el.classList.remove('sel'));trains[id]?.el.classList.add('sel');drawBoxes();}
function info(){const t=trains[selected];if(!t||!t.s){$('info').textContent='';return;}const s=t.s;
 $('info').innerHTML=`Train <b>${s.no}</b> · line ${s.line}<br>${s.atStation?'At station':'Running (estimated)'} · ${t.sp?'timetable':'no timetable'}<br>Delay: ${s.lateMin} min · ${s.time}`;}
$('pick').onchange=e=>e.target.value&&select(e.target.value);
$('follow').onclick=()=>{if(selected){following=true;}};
$('stop').onclick=()=>{following=false;map.easeTo({pitch:55,bearing:0});};
map.on('dragstart',()=>{following=false;});
async function addRailAndStations(){
  railData=await fetch('/api/rail').then(r=>r.json()); indexRail();
  map.addSource('rail',{type:'geojson',data:railData,attribution:'Track © OpenStreetMap contributors'});
  map.addLayer({id:'rail-case',type:'line',source:'rail',maxzoom:TRACK3D_ZOOM+.5,paint:{'line-color':'#000','line-opacity':.55,'line-width':['interpolate',['linear'],['zoom'],5,1.6,12,4]}});
  map.addLayer({id:'rail',type:'line',source:'rail',maxzoom:TRACK3D_ZOOM+.5,paint:{'line-color':'#ffcc33','line-width':['interpolate',['linear'],['zoom'],5,.8,12,2]}});
  map.addSource('track3d',{type:'geojson',data:EMPTY});
  map.addLayer({id:'track3d',type:'fill-extrusion',source:'track3d',minzoom:TRACK3D_ZOOM,paint:{'fill-extrusion-color':['get','c'],'fill-extrusion-height':['get','h'],'fill-extrusion-base':['get','b'],'fill-extrusion-vertical-gradient':false}});
  map.addSource('trains3d',{type:'geojson',data:EMPTY});
  map.addLayer({id:'trains3d',type:'fill-extrusion',source:'trains3d',paint:{'fill-extrusion-color':['get','c'],'fill-extrusion-height':['get','h'],'fill-extrusion-base':['get','b'],'fill-extrusion-opacity':.95}});
  map.on('click','trains3d',e=>{const f=e.features&&e.features[0];if(f)select(f.properties.id);});
  map.on('mouseenter','trains3d',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','trains3d',()=>map.getCanvas().style.cursor='');
  const st=await fetch('/api/stations').then(r=>r.json());
  map.addSource('st',{type:'geojson',data:{type:'FeatureCollection',features:st.map(s=>({type:'Feature',properties:{},geometry:{type:'Point',coordinates:[s.lon,s.lat]}}))}});
  map.addLayer({id:'st',type:'circle',source:'st',paint:{'circle-radius':['interpolate',['linear'],['zoom'],5,1.5,12,5],'circle-color':'#fff','circle-stroke-color':'#000','circle-stroke-width':1}});
  allStations=st; map.on('move',scheduleLabels); map.on('move',scheduleTrack); syncLabels(); syncTrack();
}
// ---- geometry helpers: metres on the ground <-> degrees
const EMPTY={type:'FeatureCollection',features:[]}, TRACK3D_ZOOM=11, MAX_QUADS=9000;
let railData=null; const railCells=new Map(), CELL=0.05;
const rad=x=>x*Math.PI/180, mpp=lat=>78271.5*Math.cos(rad(lat))/2**map.getZoom();
function quad(lon,lat,brg,lenM,widM,props){ // rectangle centred on lon/lat, long side along brg
  const mx=111320*Math.cos(rad(lat)),my=111320,sn=Math.sin(rad(brg)),cs=Math.cos(rad(brg)),L=lenM/2,W=widM/2;
  const pt=(a,b)=>[lon+(a*sn+b*cs)/mx,lat+(a*cs-b*sn)/my];
  return {type:'Feature',properties:props,geometry:{type:'Polygon',coordinates:[[pt(L,W),pt(L,-W),pt(-L,-W),pt(-L,W),pt(L,W)]]}};
}
function indexRail(){
  for(const f of railData.features){const c=f.geometry.coordinates;let a=180,b=90,x=-180,y=-90;
    for(let i=0;i<c.length;i++){a=Math.min(a,c[i][0]);b=Math.min(b,c[i][1]);x=Math.max(x,c[i][0]);y=Math.max(y,c[i][1]);
      if(i){const k=Math.floor(c[i][0]/CELL)+':'+Math.floor(c[i][1]/CELL);let l=railCells.get(k);if(!l)railCells.set(k,l=[]);l.push([c[i-1],c[i]]);}}
    f.bbox=[a,b,x,y];}
}
// Nearest point on any track within about 5 km, with the track's direction there.
function snapToTrack(lon,lat){
  const cx=Math.floor(lon/CELL),cy=Math.floor(lat/CELL),k=Math.cos(rad(lat));let best=null,bd=1e9;
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const l=railCells.get((cx+i)+':'+(cy+j));if(!l)continue;
    for(const [p,q] of l){const dx=(q[0]-p[0])*k,dy=q[1]-p[1],len=dx*dx+dy*dy;if(!len)continue;
      let u=(((lon-p[0])*k)*dx+(lat-p[1])*dy)/len;u=Math.max(0,Math.min(1,u));
      const px=p[0]+(q[0]-p[0])*u,py=p[1]+(q[1]-p[1])*u,d=((px-lon)*k)**2+(py-lat)**2;
      if(d<bd){bd=d;best={lon:px,lat:py,brg:(Math.atan2(dx,dy)*180/Math.PI+360)%360};}}}
  return best;
}
// ---- 3D track, generated only for the area in view
let trackView=null,trackTimer=null;
function scheduleTrack(){if(!trackTimer)trackTimer=setTimeout(()=>{trackTimer=null;syncTrack();},500);}
function syncTrack(){
  const src=map.getSource('track3d');if(!src)return;
  const z=map.getZoom(),c=map.getCenter();
  if(z<TRACK3D_ZOOM){if(trackView){src.setData(EMPTY);trackView=null;}return;}
  if(!$('rail').checked)return;
  const b0=map.getBounds(),w=b0.getEast()-b0.getWest(),h=b0.getNorth()-b0.getSouth();
  if(trackView&&Math.abs(trackView.z-z)<.2&&Math.abs(trackView.lng-c.lng)<w*.2&&Math.abs(trackView.lat-c.lat)<h*.2)return;
  trackView={z,lng:c.lng,lat:c.lat};
  const W=b0.getWest()-w*.3,E=b0.getEast()+w*.3,S=b0.getSouth()-h*.3,N=b0.getNorth()+h*.3,m=mpp(c.lat);
  const piece=Math.max(40,12*m),ballast=Math.max(7,4*m),gauge=Math.max(1,1.1*m),railW=Math.max(.5,.6*m),rails=z>=13,sleepers=z>=14.5,gap=Math.max(6,7*m);
  const out=[];
  const BAL={c:'#6e665c',b:0,h:1.2},RL={c:'#d4d8dc',b:1.5,h:2.4},SL={c:'#4b3a2a',b:1.2,h:1.6};
  for(const f of railData.features){const bb=f.bbox;if(bb[2]<W||bb[0]>E||bb[3]<S||bb[1]>N)continue;
    const cs=f.geometry.coordinates;
    for(let i=1;i<cs.length&&out.length<MAX_QUADS;i++){const p=cs[i-1],q=cs[i];
      if(Math.max(p[0],q[0])<W||Math.min(p[0],q[0])>E||Math.max(p[1],q[1])<S||Math.min(p[1],q[1])>N)continue;
      const lat=(p[1]+q[1])/2,dx=(q[0]-p[0])*111320*Math.cos(rad(lat)),dy=(q[1]-p[1])*111320,len=Math.hypot(dx,dy);if(!len)continue;
      const brg=Math.atan2(dx,dy)*180/Math.PI,n=Math.max(1,Math.ceil(len/piece)),pl=len/n,sn=Math.sin(rad(brg)),cn=Math.cos(rad(brg)),mx=111320*Math.cos(rad(lat));
      for(let k=0;k<n&&out.length<MAX_QUADS;k++){const u=(k+.5)/n,lo=p[0]+(q[0]-p[0])*u,la=p[1]+(q[1]-p[1])*u;
        out.push(quad(lo,la,brg,pl*1.04,ballast,BAL));
        if(rails)for(const o of [-gauge,gauge])out.push(quad(lo+o*cn/mx,la-o*sn/111320,brg,pl*1.04,railW,RL));
        if(sleepers)for(let d=-pl/2+gap/2;d<pl/2;d+=gap)out.push(quad(lo+d*sn/mx,la+d*cn/111320,brg+90,ballast*.8,gap*.3,SL));
      }}}
  src.setData({type:'FeatureCollection',features:out});
}
// ---- trains: placeholder 3D boxes (swap for a real model later)
function place(t,id,ll,ahead,bd){
  const lon=ll.lng??ll[0],lat=ll.lat??ll[1],sn=railData&&snapToTrack(lon,lat);
  const x=sn?sn.lon:lon,y=sn?sn.lat:lat,toAhead=ahead?bearingTo({lng:x,lat:y},ahead):0;
  let brg=sn?sn.brg:toAhead; if(sn&&ahead&&Math.cos(rad(brg-toAhead))<0)brg=(brg+180)%360;
  t.pos=[x,y];t.head=brg;
  if(id===selected||bd.contains(t.pos))t.marker.setLngLat(t.pos);
  const c=map.getCenter(),far=map.getPitch()>50&&id!==selected&&Math.hypot((x-c.lng)*Math.cos(rad(c.lat)),y-c.lat)>.2;
  t.el.style.display=far?'none':'';
}
function drawBoxes(){
  const src=map.getSource('trains3d');if(!src)return;
  const fs=[];
  for(const id in trains){const t=trains[id];if(!t.pos||!t.s)continue;
    const m=mpp(t.pos[1]),L=Math.max(200,34*m),W=Math.max(14,9*m),H=Math.max(14,8*m);
    fs.push(quad(t.pos[0],t.pos[1],t.head||0,L,W,{id,c:id===selected?'#ffee00':COLORS[t.s.line],b:Math.min(2.5,H*.1),h:H}));}
  src.setData({type:'FeatureCollection',features:fs});
}
// Only stations in frame exist as DOM markers; everything else costs nothing.
let allStations=[], labelTimer=null; const labelMarkers=new Map(); const MAX_LABELS=120, ALL_LABELS_ZOOM=8;
function scheduleLabels(){if(!labelTimer)labelTimer=setTimeout(()=>{labelTimer=null;syncLabels();},300);}
function makeLabel(s){const el=document.createElement('div');el.className='st';
  const b=document.createElement('b');b.textContent=s.th;el.appendChild(b);
  if(s.en&&s.en!==s.th){const e=document.createElement('span');e.textContent=' '+s.en;el.appendChild(e);}
  return new maplibregl.Marker({element:el,anchor:'left',offset:[7,0]}).setLngLat([s.lon,s.lat]).addTo(map);}
function syncLabels(){
  const want=new Set();
  if($('labels').checked){
    const z=map.getZoom(),bd=map.getBounds(),c=map.getCenter(),d=s=>(s.lon-c.lng)**2+(s.lat-c.lat)**2;
    const inView=allStations.filter(s=>(s.major||z>=ALL_LABELS_ZOOM)&&bd.contains([s.lon,s.lat]));
    inView.sort((x,y)=>(y.major-x.major)||(d(x)-d(y)));
    for(const s of inView.slice(0,MAX_LABELS))want.add(s);
  }
  for(const [s,m] of labelMarkers)if(!want.has(s)){m.remove();labelMarkers.delete(s);}
  for(const s of want)if(!labelMarkers.has(s))labelMarkers.set(s,makeLabel(s));
}
$('rail').onchange=e=>{['rail-case','rail','track3d'].forEach(l=>map.setLayoutProperty(l,'visibility',e.target.checked?'visible':'none'));trackView=null;syncTrack();};
$('labels').onchange=e=>{map.setLayoutProperty('st','visibility',e.target.checked?'visible':'none');syncLabels();};
map.on('load',async()=>{await addRailAndStations();timetable=await fetch('/api/timetable').then(r=>r.json());await refresh();setInterval(refresh,15000);requestAnimationFrame(frame);});
</script></body></html>
